<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snapchat</title>
  <link href="style.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>

<body>
  <h1>Snapchat</h1>
  <img id="myImage" src="https://clipart.info/images/ccovers/1522453412Logo-Snapchat-Png.png" alt="Snapchat logo" width="200" height="200">
  <!-- Plays when the second image is shown. Swap sound.wav for your own file if you like. -->
  <audio id="myAudio" src="sound.wav" preload="auto"></audio>

  <!--
  This script places a badge on your repl's full-browser view back to your repl's cover
  page. Try various colors for the theme: dark, light, red, orange, yellow, lime, green,
  teal, blue, blurple, magenta, pink!
  -->
  <script src="https://replit.com/public/js/replit-badge-v2.js" theme="dark" position="bottom-right" async></script>
</body>

</html>
